name: Android verification
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'platform-tools'
      - name: Generate standard Gradle wrapper when bootstrapping
        run: |
          mkdir -p verification
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p "$RUNNER_TEMP/wrapper-bootstrap"
            printf 'rootProject.name = "wrapper-bootstrap"\n' > "$RUNNER_TEMP/wrapper-bootstrap/settings.gradle.kts"
            gradle -p "$RUNNER_TEMP/wrapper-bootstrap" wrapper --gradle-version 9.3.1 --distribution-type bin
            cp "$RUNNER_TEMP/wrapper-bootstrap/gradlew" .
            cp "$RUNNER_TEMP/wrapper-bootstrap/gradlew.bat" .
            mkdir -p gradle/wrapper
            cp "$RUNNER_TEMP/wrapper-bootstrap/gradle/wrapper/"* gradle/wrapper/
          fi
          chmod +x gradlew
          ./gradlew --version | tee verification/toolchain.txt
      - name: Build APKs, unit tests and lint
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleRelease --stacktrace --console=plain 2>&1 | tee verification/build.log
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > verification/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > verification/package.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > verification/SHA256SUMS.txt
          git rev-parse HEAD > verification/commit.txt
      - name: Archive exact build source and wrapper
        if: always()
        run: |
          tar --exclude='./.git' --exclude='./.gradle' --exclude='./.kotlin' --exclude='./app/build' --exclude='./verification' -czf "$RUNNER_TEMP/control-centre-source.tar.gz" .
          cp "$RUNNER_TEMP/control-centre-source.tar.gz" verification/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-centre-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/
            app/build/test-results/
            verification/
          retention-days: 14
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: control-centre-verification
          path: evidence
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 37 UI smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-centre-emulator
          path: emulator-evidence/
          retention-days: 14
